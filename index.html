<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdelrahman Hassan Elnebairy | UI/UX Designer Portfolio</title>
    <!-- استدعاء الخطوط والأيقونات -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #08090d;
            --bg-card: #11131c;
            --bg-card-hover: #171a26;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --accent-purple: #8b5cf6;
            --accent-indigo: #6366f1;
            --accent-cyan: #06b6d4;
            --gradient-primary: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(139, 92, 246, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Inter', 'Cairo', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* خلفية توهج */
        .ambient-glow {
            position: absolute;
            top: -150px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(168, 85, 247, 0.08) 40%, transparent 70%);
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }

        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 30px;
            color: #a5b4fc;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 25px;
        }

        .badge i { font-size: 0.75rem; color: var(--accent-cyan); }

        .hero h1 {
            font-size: 3.8rem;
            font-weight: 800;
            margin-bottom: 12px;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero h2 {
            font-size: 1.5rem;
            font-weight: 400;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 35px;
        }

        /* معرض الأعمال */
        .portfolio-section {
            padding: 60px 2%;
            max-width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .section-header { text-align: center; margin-bottom: 50px; }
        .section-title { font-size: 2.2rem; font-weight: 800; }
        .section-title span { background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .section-subtitle { color: var(--text-muted); font-size: 1rem; margin-top: 8px; }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        .work-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            height: 420px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .work-card:hover {
            border-color: var(--border-hover);
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(99, 102, 241, 0.2);
        }

        .card-main-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px;
        }

        /* الصفحة العايمة المكونة من نص الشاشة (Floating Preview Box) */
        .floating-preview-box {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.85);
            width: 60vw; /* بياخد 60% من عرض الشاشة */
            max-width: 1000px;
            background: rgba(13, 15, 23, 0.96);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-hover);
            border-radius: 24px;
            padding: 25px;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.85);
            opacity: 0;
            visibility: hidden;
            pointer-events: none; /* عشان الماوس يفضل حاسس بالكارت اللي تحته */
            transition: all 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 9999;
        }

        /* حالة الظهور عند المرور بالماوس */
        .floating-preview-box.active {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .preview-header {
            font-size: 1.1rem;
            font-weight: 700;
            color: #a5b4fc;
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .floating-preview-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* رص الـ 3 صور جنب بعض بحجم كبير */
            gap: 15px;
            max-height: 65vh;
        }

        .floating-preview-grid img {
            width: 100%;
            height: 380px;
            object-fit: cover;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
        }

        /* قسم التواصل */
        .contact-section {
            padding: 90px 10%;
            background: linear-gradient(180deg, var(--bg-dark) 0%, #050608 100%);
            text-align: center;
            border-top: 1px solid var(--border-color);
        }

        .contact-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin-top: 40px;
        }

        .contact-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 28px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            color: var(--text-light);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            direction: ltr;
        }

        .contact-btn:hover {
            background: var(--gradient-primary);
            color: #ffffff;
            transform: translateY(-3px);
        }

        @media (max-width: 1200px) {
            .grid-container { grid-template-columns: repeat(3, 1fr); }
            .floating-preview-box { width: 80vw; }
        }

        @media (max-width: 900px) {
            .grid-container { grid-template-columns: repeat(2, 1fr); }
            .floating-preview-box { width: 90vw; }
            .floating-preview-grid { grid-template-columns: 1fr; max-height: 50vh; overflow-y: auto; }
            .floating-preview-grid img { height: 250px; }
        }

        @media (max-width: 600px) {
            .grid-container { grid-template-columns: repeat(1, 1fr); }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <!-- الواجهة الرئيسية -->
    <header class="hero">
        <div class="badge">
            <i class="fa-solid fa-circle"></i> Available for New Projects
        </div>
        <h1>Abdelrahman Hassan Elnebairy</h1>
        <h2>UI/UX Designer & Digital Product Specialist</h2>
    </header>

    <!-- معرض الأعمال -->
    <section id="portfolio" class="portfolio-section">
        <div class="section-header">
            <h2 class="section-title">Selected <span>Case Studies</span></h2>
            <p class="section-subtitle">مرّر الماوس فوق أي مشروع لفتح المعاينة في منتصف الشاشة بحجم كبير</p>
        </div>
        
        <div class="grid-container">
            
            <!-- كارت مشروع 1 (مكتوب فيه لستة الصور التابعة له) -->
            <div class="work-card" data-title="E-Commerce UI/UX Design" data-images="Screenshot 2026-08-12 021337.png, Screenshot 2026-08-12 021423.png, Screenshot 2026-08-12 021442.png">
                <img src="Screenshot 2026-08-12 021824.png" alt="UI/UX Cover 1" class="card-main-img" onerror="this.outerHTML='<p style=\'text-align:center; padding:20px;\'>مشروع UI/UX 1</p>'">
            </div>

            <!-- تقدر تضيف كروت مشاريع تانية بنفس الطريقة -->

        </div>
    </section>

    <!-- الصفحة العايمة الموحدة (بتظهر في نص الشاشة بحجم نص الشاشة) -->
    <div id="floatingPreviewBox" class="floating-preview-box">
        <div class="preview-header">
            <i class="fa-solid fa-layer-group"></i> <span id="previewTitle">معاينة الشاشات والتفاصيل</span>
        </div>
        <div class="floating-preview-grid" id="previewGrid">
            <!-- الصور هتنزل هنا كودياً بروقان -->
        </div>
    </div>

    <!-- قسم التواصل -->
    <section class="contact-section">
        <h2 class="section-title">Let's <span>Connect</span></h2>
        <div class="contact-container">
            <a href="https://www.behance.net/abdo_elnebairyy" target="_blank" class="contact-btn">
                <i class="fa-brands fa-behance"></i> Behance
            </a>
            <a href="https://wa.me/201091450369" target="_blank" class="contact-btn">
                <i class="fa-brands fa-whatsapp"></i> WhatsApp
            </a>
            <a href="javascript:void(0)" onclick="smartEmail()" class="contact-btn">
                <i class="fa-regular fa-envelope"></i> Email
            </a>
            <a href="https://www.linkedin.com/in/abdo-elnebairy-902388429/" target="_blank" class="contact-btn">
                <i class="fa-brands fa-linkedin-in"></i> LinkedIn
            </a>
        </div>
    </section>

    <script>
        const previewBox = document.getElementById('floatingPreviewBox');
        const previewGrid = document.getElementById('previewGrid');
        const previewTitle = document.getElementById('previewTitle');

        // ربط أحداث الماوس مع جميع الكروت
        document.querySelectorAll('.work-card').forEach(card => {
            card.addEventListener('mouseenter', () => {
                const title = card.getAttribute('data-title') || 'معاينة الشاشات والتفاصيل';
                const imagesAttr = card.getAttribute('data-images');
                
                if (imagesAttr) {
                    const images = imagesAttr.split(',');
                    previewTitle.innerText = title;
                    previewGrid.innerHTML = '';

                    images.forEach(imgSrc => {
                        const img = document.createElement('img');
                        img.src = imgSrc.trim();
                        img.onerror = function() {
                            this.outerHTML = `<div style="padding:20px; text-align:center; background:#111; border-radius:12px;">${imgSrc.trim()} غير موجودة</div>`;
                        };
                        previewGrid.appendChild(img);
                    });

                    previewBox.classList.add('active');
                }
            });

            card.addEventListener('mouseleave', () => {
                previewBox.classList.remove('active');
            });
        });

        function smartEmail() {
            const email = "abdoelnebairy@gmail.com";
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            
            if (isMobile) {
                window.location.href = "mailto:" + email;
            } else {
                window.open("https://mail.google.com/mail/?view=cm&fs=1&to=" + email, "_blank");
            }
        }
    </script>
    
</body>
</html>
