<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abdelrahman Hassan Elnebairy | UI/UX Designer Portfolio</title>
    <!-- استدعاء خطوط حديثة مناسبة للـ UI/UX -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ثيم عصري وفاخر مخصص للـ UI/UX (Deep Obsidian + Electric Indigo Glow) */
        :root {
            --bg-dark: #08090d;
            --bg-card: #11131c;
            --bg-card-hover: #171a26;
            --text-light: #f8fafc;
            --text-muted: #94a3b8;
            --accent-purple: #8b5cf6;
            --accent-indigo: #6366f1;
            --accent-cyan: #06b6d4;
            --gradient-primary: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-hover: rgba(139, 92, 246, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Inter', 'Cairo', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* شريط التمرير أنيق */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-dark); }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }

        /* خلفية توهج ديكورية للجزء العلوي (Ambient Glow) */
        .ambient-glow {
            position: absolute;
            top: -150px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, rgba(168, 85, 247, 0.08) 40%, transparent 70%);
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }

        /* الهيدر أو الواجهة */
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 16px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 30px;
            color: #a5b4fc;
            font-size: 0.9rem;
            font-weight: 500;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
            animation: fadeInDown 0.8s ease-out;
        }

        .badge i {
            font-size: 0.75rem;
            color: var(--accent-cyan);
        }

        .hero h1 {
            font-size: 3.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 12px;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fadeInDown 1s ease-out;
            line-height: 1.2;
        }

        .hero h2 {
            font-size: 1.5rem;
            font-weight: 400;
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 35px;
            animation: fadeInUp 1s ease-out 0.3s backwards;
        }

        .scroll-down {
            position: absolute;
            bottom: 40px;
            font-size: 1.8rem;
            color: var(--text-muted);
            text-decoration: none;
            animation: bounce 2s infinite;
            transition: color 0.3s;
        }
        .scroll-down:hover { color: var(--text-light); }

        /* معرض الأعمال */
        .portfolio-section {
            padding: 60px 2%;
            max-width: 100%;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .section-header {
            text-align: center;
            margin-bottom: 50px;
        }

        .section-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-light);
            letter-spacing: -0.5px;
        }
        
        .section-title span {
            background: var(--gradient-primary);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .section-subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            margin-top: 8px;
        }

        /* شبكة الكروت بعرض الشاشة */
        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
        }

        /* تصميم كروت الـ UI/UX */
        .work-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            height: 420px;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            overflow: hidden;
            color: var(--text-muted);
        }

        .work-card:hover {
            transform: translateY(-8px);
            border-color: var(--border-hover);
            background-color: var(--bg-card-hover);
            box-shadow: 0 20px 40px -15px rgba(99, 102, 241, 0.25);
        }
        
        .work-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 16px;
            transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .work-card:hover img {
            transform: scale(1.04);
        }

        /* قسم التواصل */
        .contact-section {
            padding: 90px 10%;
            background: linear-gradient(180deg, var(--bg-dark) 0%, #050608 100%);
            text-align: center;
            border-top: 1px solid var(--border-color);
            position: relative;
            z-index: 1;
        }

        .contact-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 16px;
            margin-top: 40px;
        }

        .contact-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 28px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            color: var(--text-light);
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            direction: ltr;
            cursor: pointer;
            font-family: inherit;
        }

        .contact-btn:hover {
            background: var(--gradient-primary);
            color: #ffffff;
            border-color: transparent;
            transform: translateY(-3px);
            box-shadow: 0 10px 25px -5px rgba(139, 92, 246, 0.4);
        }

        .contact-btn i { font-size: 1.2rem; }

        /* أنيميشن */
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-12px); }
            60% { transform: translateY(-6px); }
        }

        /* الاستجابة للشاشات */
        @media (max-width: 1200px) {
            .grid-container { grid-template-columns: repeat(3, 1fr); }
        }

        @media (max-width: 900px) {
            .grid-container { grid-template-columns: repeat(2, 1fr); }
            .hero h1 { font-size: 2.8rem; }
            .hero h2 { font-size: 1.2rem; }
        }

        @media (max-width: 600px) {
            .grid-container { grid-template-columns: repeat(1, 1fr); }
            .portfolio-section { padding: 40px 15px; }
            .work-card { height: 350px; }
            .contact-btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <!-- الواجهة الرئيسية -->
    <header class="hero">
        <div class="badge">
            <i class="fa-solid fa-circle"></i> Available for New Projects
        </div>
        <h1>Abdelrahman Hassan Elnebairy</h1>
        <h2>UI/UX Designer & Digital Product Specialist</h2>
        <a href="#portfolio" class="scroll-down">
            <i class="fa-solid fa-chevron-down"></i>
        </a>
    </header>

    <!-- معرض الأعمال (4 كروت جنب بعض) -->
    <section id="portfolio" class="portfolio-section">
        <div class="section-header">
            <h2 class="section-title">Selected <span>Case Studies</span></h2>
            <p class="section-subtitle">إليك مجموعة من أحدث مشاريع وتطبيقات الـ UI/UX والتصميم الرقمي</p>
        </div>
        
        <div class="grid-container">
            
            <div class="work-card">
                <img src="1.jpg" alt="UI/UX Project 1" onerror="this.outerHTML='<p style=\'text-align:center; padding:20px;\'>مشروع UI/UX 1<br><span style=\'font-size:0.85rem; opacity:0.7;\'>سمّ الصورة 1.jpg</span></p>'">
            </div>
           
        </div>
    </section>

    <!-- قسم التواصل -->
    <section class="contact-section">
        <h2 class="section-title">Let's <span>Connect</span></h2>
        <p style="color: var(--text-muted); font-size: 1.05rem; margin-top: 10px;">جاهز لتحويل الأفكار إلى تجارب مستخدم مذهلة وتطبيقات تفاعلية.</p>
        
        <div class="contact-container">
              <div class="contact-container">
            <a href="https://www.behance.net/abdo_elnebairyy" target="_blank" class="contact-btn">
                <i class="fa-brands fa-behance"></i> Behance
            </a>
            <a href="https://wa.me/201091450369" target="_blank" class="contact-btn">
                <i class="fa-brands fa-whatsapp"></i> WhatsApp
            </a>
         <!-- زر الإيميل الذكي -->
<a href="javascript:void(0)" onclick="smartEmail()" class="contact-btn">
    <i class="fa-regular fa-envelope"></i> Email
</a>
            <a href="https://www.linkedin.com/in/abdo-elnebairy-902388429/" target="_blank" class="contact-btn">
                <i class="fa-brands fa-linkedin-in"></i> LinkedIn
            </a>
        </div>
    </section>

    <script>
    function smartEmail() {
        const email = "abdoelnebairy@gmail.com";
        
        // الكود ده بيكتشف نوع الجهاز (موبايل ولا كمبيوتر)
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        
        if (isMobile) {
            // لو الموبايل: هيشغل الطريقة اللي نفعت معاك عالفون
            window.location.href = "mailto:" + email;
        } else {
            // لو لاب توب: هيفتح لينك الجيميل المباشر في تاب جديدة (بدون ما يقرب لـ Outlook)
            window.open("https://mail.google.com/mail/?view=cm&fs=1&to=" + email, "_blank");
        }
    }
</script>
    
</body>
</html>
